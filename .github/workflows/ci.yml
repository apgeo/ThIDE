# REL-01 — CI matrix: build + test on Windows, Linux and macOS.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ThIDE.sln

      # -m:1 mirrors the known-good local build (the solution OOMs MSBuild under parallel build).
      - name: Build
        run: dotnet build ThIDE.sln -m:1 --no-restore -c Release

      - name: Test
        run: dotnet test ThIDE.sln -m:1 --no-build -c Release --verbosity normal

  # End-to-end UI tests on a virtual display (tests/run-ui-tests.sh): the C# suite over the in-app
  # automation server and the black-box AT-SPI suite. Non-blocking until it has a track record on
  # hosted runners.
  ui-tests:
    name: UI tests (linux, xvfb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install display, accessibility and toolchain packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xfwm4 dbus-x11 at-spi2-core xdotool \
            python3-gi gir1.2-atspi-2.0 python3-pil python3-pytest \
            libwebkit2gtk-4.1-0 therion survex

      - name: Run UI tests
        run: tests/run-ui-tests.sh all

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: tests/ui-artifacts/

  # net10.0 leg. The libraries (and, through the same switch, the library test projects)
  # also build for net10.0; the matrix above is pinned to the 8.0 SDK and never compiles or
  # runs those assemblies. Both SDKs are installed because the apps stay net8.0.
  build-test-net10:
    name: build & test net10.0 (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ThIDE.sln -p:TherionMultiTargetNet10=true

      - name: Build (net8.0 + net10.0)
        run: dotnet build ThIDE.sln -m:1 --no-restore -c Release -p:TherionMultiTargetNet10=true

      # Every test project that follows the libraries' target frameworks, on net10.0 only;
      # the net8.0 half is what the matrix above already covers.
      - name: Test (net10.0)
        shell: bash
        run: |
          set -euo pipefail
          for proj in $(grep -l 'TherionTestTargetFrameworks' tests/*/*.csproj); do
            dotnet test "$proj" --no-build -c Release --framework net10.0 --verbosity normal -p:TherionMultiTargetNet10=true
          done
